name: Build Pure Native Qt6 Linux AppImage

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-native-appimage:
    name: Build & Verify Native Qt6 Linux AppImage (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install X11/Wayland Helper Libraries & Xvfb for Verification
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libxkbcommon-x11-0 libxcb-util1 libegl1 libgl1 libdbus-1-3 \
            libpulse-mainloop-glib0 libasound2 xvfb fuse libfuse2

      - name: Install Python Native GUI Dependencies (Qt6 / PySide6 + PyInstaller)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Standalone Native Qt6 AppImage
        run: |
          chmod +x scripts/build-native-appimage.sh
          bash scripts/build-native-appimage.sh

      - name: End-to-End X11 Smoke Test on Built AppImage
        run: |
          xvfb-run -a ./dist/Sirag-Atlas-Seerah-x86_64.AppImage --appimage-extract-and-run --self-test

      - name: Upload Native AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sirag-Atlas-Native-Qt6-AppImage
          path: dist/Sirag-Atlas-Seerah-x86_64.AppImage

      - name: Publish Ready-to-Run GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "سراج أطلس السيرة النبوية ${{ github.ref_name }} — واجهة لينكس الأصلية المستقلة (Pure Native Qt6 AppImage)"
          body: |
            ## 🕌 سراج أطلس السيرة النبوية ﷺ — واجهة لينكس الأصلية المستقلة (${{ github.ref_name }})
            **✨ تم التطوير بواسطة محمد صلاح عبد الخالق**

            ### 🖥️ واجهة سطح مكتب أصلية حقيقية 100% (Pure Native Qt 6 GUI)
            - **بدون Electron نهائياً • بدون أي متصفح أو WebView أو Chromium!**
            - محرك رسوميات متجهة أصلي (`QPainter` 60 FPS) للخرائط الفلكية، مسار الهجرة، محاكي الغزوات، مخطط الحرمين، مجرة الصحابة، وشجرة النسب النبوي.
            - خطوط عربية مضمّنة داخلياً (`Amiri` + `Readex Pro`) وصوتيات فصيحة أوفلاين (`QtMultimedia`) وتصدير بطاقات وشهادات عالية الدقة (`QImage`).
            - يعمل على **X11 و Wayland** في جميع توزيعات لينكس الحديثة والقديمة (مبني على `glibc 2.35` ومختبر آلياً قبل النشر).

            ### ⚡ التشغيل الفوري:
            ```bash
            chmod +x Sirag-Atlas-Seerah-x86_64.AppImage
            ./Sirag-Atlas-Seerah-x86_64.AppImage
            ```
          files: dist/Sirag-Atlas-Seerah-x86_64.AppImage
